x-app-env: &app-env
  REDIS_URL: redis://redis:6379/0
  DATABASE_URL: postgresql://trader:${POSTGRES_PASSWORD:-change-me}@db:5432/trading
  TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
  ALLOWED_USER_ID: ${ALLOWED_USER_ID:-0}
  SYMBOLS: ${SYMBOLS:-BTC/USD,ETH/USD}
  TIMEFRAME: ${TIMEFRAME:-4h}
  EMA_LEN: ${EMA_LEN:-200}
  ST_LEN: ${ST_LEN:-10}
  ST_MULT: ${ST_MULT:-3.0}
  ADX_LEN: ${ADX_LEN:-14}
  ADX_MIN: ${ADX_MIN:-20}
  BREAKOUT_LEN: ${BREAKOUT_LEN:-20}
  ENTRY_MODE: ${ENTRY_MODE:-state}
  EXIT_LEN: ${EXIT_LEN:-0}
  ADX_RISING: ${ADX_RISING:-false}
  REGIME_SYMBOL: ${REGIME_SYMBOL:-BTC/USD}
  REJECT_COOLDOWN_BARS: ${REJECT_COOLDOWN_BARS:-6}
  POLL_SECONDS: ${POLL_SECONDS:-120}
  SIGNAL_TTL_MIN: ${SIGNAL_TTL_MIN:-60}
  PAPER_CAPITAL: ${PAPER_CAPITAL:-10000}
  RISK_PCT: ${RISK_PCT:-0.5}
  MAX_OPEN_RISK_PCT: ${MAX_OPEN_RISK_PCT:-1.0}
  MAX_NOTIONAL_PCT: ${MAX_NOTIONAL_PCT:-}
  MAX_POSITIONS: ${MAX_POSITIONS:-2}
  AUTO_EXIT: ${AUTO_EXIT:-true}
  BROKER: ${BROKER:-paper}
  KRAKEN_API_KEY: ${KRAKEN_API_KEY:-}
  KRAKEN_API_SECRET: ${KRAKEN_API_SECRET:-}
  LIVE_CONFIRM: ${LIVE_CONFIRM:-}
  AUTO_APPROVE: ${AUTO_APPROVE:-night}
  QUIET_HOURS: ${QUIET_HOURS:-22-07}
  AUTO_ON_EXPIRE: ${AUTO_ON_EXPIRE:-true}
  AUTO_APPROVE_LIVE: ${AUTO_APPROVE_LIVE:-}
  REPORT_TZ: ${REPORT_TZ:-Europe/Zurich}
  REPORT_HOUR: ${REPORT_HOUR:-8}
  SNAPSHOT_MINUTES: ${SNAPSHOT_MINUTES:-60}

x-app: &app
  build: .
  image: trading-stack-app:latest
  environment: *app-env
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis-data:/data]
    command: ["redis-server", "--appendonly", "yes"]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: trading
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading"]
      interval: 5s
      timeout: 3s
      retries: 20

  strategy:
    <<: *app
    command: ["python", "-m", "app.strategy"]

  bot:
    <<: *app
    command: ["python", "-m", "app.bot"]

  executor:
    <<: *app
    command: ["python", "-m", "app.executor"]

volumes:
  redis-data:
  pg-data:
